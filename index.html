<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Dictionary</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: black;
      font-family: monospace;
      color: white;
    }

    #container {
      width: 280px;       /* bean width */
      height: 50px;       /* bean height */
      background: black;
      border: 2px solid white;
      border-radius: 25px; /* capsule look */
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.8s ease-in-out;
      overflow: hidden;
      position: relative;
      flex-direction: column;
    }

    /* Square target state */
    #container.square {
      width: 600px;
      height: 300px;
      border-radius: 8px; /* sharp corners */
      padding: 20px;
      justify-content: flex-start;
    }

    /* Password input */
    #password-input {
      width: 180px;
      background: transparent;
      border: none;
      color: white;
      font-family: monospace;
      font-size: 18px;
      outline: none;
      caret-color: white;   /* native blinking caret */
      text-align: center;
      transition: opacity 0.5s ease;
      z-index: 2;
    }

    #dictionary {
      color: white;
      font-size: 16px;
      white-space: pre-wrap;
      opacity: 0;
      margin-top: 10px;
      overflow-y: auto;
      flex: 1;
      z-index: 1;
    }
  </style>
</head>
<body>

<div id="container">
  <div style="display:flex; align-items:center;">
    <input type="password" id="password-input" autofocus>
  </div>
  <div id="dictionary"></div>
</div>

<script>
  const correctPassword = "@2#1#3$1#1%1#1^3%2(2*1@2^2#3(1&1^3#3*1(2!2#2$3!2^3#3#1#2";
  const dictionaryData = `
📖 Private Dictionary
------------------------
KuroSaru - (noun) A Japanese-inspired name meaning “Black Monkey”
Kokujin - (noun) Japanese term meaning “black person”
Janna - (slang'd-name) Someone fat
Kevin - (slang'd-name) Kevin is a slang term meaning "something bad"
Owen - (slang'd-name) meaning "something good"
Pica - (vulgar) Slovak insult, roughly equivalent to “bitch”
  `;

  const container = document.getElementById("container");
  const input = document.getElementById("password-input");
  const dict = document.getElementById("dictionary");

  input.addEventListener("keydown", e => {
    if(e.key === "Enter"){
      if(input.value === correctPassword){
        container.classList.add("square");

        // fade out input
        input.style.opacity = 0;

        // wait for morph to finish
        setTimeout(() => {
          let i = 0;
          dict.style.opacity = 1;
          (function typeDict(){
            if(i < dictionaryData.length){
              dict.textContent += dictionaryData[i++];
              setTimeout(typeDict, 15);
            }
          })();
        }, 900);
      } else {
        input.value = "";
        alert("Access denied. Try again.");
      }
    }
  });
</script>

</body>
</html>
