<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Dictionary</title>
<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background-color: black;
  font-family: monospace;
  color: white;
}

/* Password "bean" input container */
.input-container {
  position: relative;
  width: 300px;
}

.input-container input {
  width: 100%;
  padding: 12px 16px;
  font-size: 18px;
  background: black;
  color: white;
  border: 2px solid white; /* white outline */
  border-radius: 25px; /* bean shape */
  outline: none;
  caret-color: white;
  transition: border-color 0.3s, box-shadow 0.3s;
}

/* Apple-style hover/focus */
.input-container input:hover,
.input-container input:focus {
  border-color: white;
  box-shadow: 0 0 0 2px rgba(255,255,255,0.2);
}

/* Blinking caret (pseudo-terminal style) */
.input-container input::after {
  content: '|';
  display: inline;
  animation: blink 1s step-start infinite;
}

@keyframes blink {
  50% { opacity: 0; }
}

/* Dictionary box */
#dictionary {
  display: none;
  margin-top: 20px;
  background: black; /* black inside */
  color: white;
  padding: 20px;
  width: 600px;
  max-width: 90%;
  border: 2px solid white; /* white outline */
  border-radius: 8px;
  white-space: pre-wrap;
  font-size: 16px;
  opacity: 0;
  transform: translateY(-10px);
  transition: opacity 0.3s ease, transform 0.3s ease;
}

#dictionary.show {
  opacity: 1;
  transform: translateY(0);
}
</style>
</head>
<body>

<div class="input-container">
  <input type="password" id="password" placeholder="Enter password" autofocus>
</div>

<div id="dictionary"></div>

<script>
const correctPassword = "@2#1#3$1#1%1#1^3%2(2*1@2^2#3(1&1^3#3*1(2!2#2$3!2^3#3#1#2";
const dictionaryData = `
📖 Private Dictionary
------------------------
KuroSaru - (noun) A Japanese-inspired name meaning “Black Monkey”; from kuro (黒, “black”) + saru (猿, “monkey”)
Kokujin - (noun) Japanese term meaning “black person”
Janna - (slang'd-name) Someone fat
Kevin - (slang'd-name) Kevin is a slang term meaning "something bad"
Owen - (slang'd-name) meaning "something good"
Pica - (vulgar) A crude insult in Slovak, roughly equivalent to “bitch”
`;

const input = document.getElementById("password");
const dict = document.getElementById("dictionary");

input.addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    if(input.value === correctPassword){
      dict.textContent = dictionaryData;
      dict.style.display = "block";
      setTimeout(() => dict.classList.add("show"), 10); // smooth fade-in
      input.parentElement.style.display = "none";
    } else {
      input.value = "";
      alert("Access denied. Try again.");
    }
  }
});
</script>

</body>
</html>
