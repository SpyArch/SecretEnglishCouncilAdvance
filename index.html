<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Dictionary</title>
<style>
/* --- Body --- */
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background-color: black;
  font-family: monospace;
  color: white;
}

/* --- Password container --- */
#password-container {
  width: 300px;
  padding: 12px 16px;
  font-size: 18px;
  background: black;
  border: 2px solid white;
  border-radius: 25px; /* bean shape */
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: all 0.5s ease;
  overflow: hidden;
}

#password-container.square {
  width: 600px;
  height: 300px;
  border-radius: 8px; /* square */
  flex-direction: column;
  padding: 20px;
  justify-content: flex-start;
}

/* --- Input field --- */
#password-input {
  flex: 1;
  background: black;
  border: none;
  color: white;
  font-family: monospace;
  font-size: 18px;
  outline: none;
  caret-color: white;
}

/* --- Blinking caret --- */
.caret {
  display: inline-block;
  width: 10px;
  background-color: white;
  animation: blink 1s steps(1) infinite;
  margin-left: 4px;
}
@keyframes blink {
  50% { background-color: transparent; }
}

/* --- Dictionary text --- */
#dictionary {
  color: white;
  font-size: 16px;
  white-space: pre-wrap;
  opacity: 0;
  margin-top: 10px;
  flex: 1;
  overflow-y: auto;
}
</style>
</head>
<body>

<div id="password-container">
  <span id="prompt"></span>
  <input type="password" id="password-input" autofocus>
  <span class="caret"></span>
  <div id="dictionary"></div>
</div>

<script>
// --- Password & dictionary ---
const correctPassword = "@2#1#3$1#1%1#1^3%2(2*1@2^2#3(1&1^3#3*1(2!2#2$3!2^3#3#1#2";
const dictionaryData = `
📖 Private Dictionary
------------------------
KuroSaru - (noun) A Japanese-inspired name meaning “Black Monkey”
Kokujin - (noun) Japanese term meaning “black person”
Janna - (slang'd-name) Someone fat
Kevin - (slang'd-name) Kevin is a slang term meaning "something bad"
Owen - (slang'd-name) meaning "something good"
Pica - (vulgar) Slovak insult, roughly equivalent to “bitch”
`;

// --- Type prompt animation ---
const promptText = "Enter password:";
const promptSpan = document.getElementById("prompt");
let promptIndex = 0;

(function typePrompt() {
  if(promptIndex < promptText.length){
    promptSpan.textContent += promptText[promptIndex++];
    setTimeout(typePrompt, 100); // typing speed
  }
})();

// --- Elements ---
const input = document.getElementById("password-input");
const container = document.getElementById("password-container");
const dict = document.getElementById("dictionary");
const caret = document.querySelector(".caret");

// --- Handle Enter key ---
input.addEventListener("keydown", e => {
  if(e.key === "Enter"){
    if(input.value === correctPassword){
      // Morph bean → square
      container.classList.add("square");
      input.style.display = "none";
      caret.style.display = "none";

      // Smooth dictionary typing
      let i = 0;
      dict.style.opacity = 1;
      (function typeDict(){
        if(i < dictionaryData.length){
          dict.textContent += dictionaryData[i++];
          setTimeout(typeDict, 15); // faster typing
        }
      })();
    } else {
      input.value = "";
      alert("Access denied. Try again.");
    }
  }
});
</script>

</body>
</html>
