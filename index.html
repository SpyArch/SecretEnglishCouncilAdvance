<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Dictionary</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: black;
      font-family: monospace;
      color: white;
    }

    #container {
      width: 280px;
      height: 50px;
      background: black;
      border: 2px solid white;
      border-radius: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.8s ease-in-out;
      overflow: hidden;
      position: relative;
      flex-direction: column;
    }

    #container.square {
      width: 600px;
      height: 300px;
      border-radius: 8px;
      padding: 20px;
      justify-content: flex-start;
    }

    #password-input {
      width: 180px;
      background: transparent;
      border: none;
      color: white;
      font-family: monospace;
      font-size: 18px;
      outline: none;
      caret-color: white;
      text-align: center;
      transition: opacity 0.5s ease;
      z-index: 2;
    }

    #dictionary {
      color: white;
      font-size: 16px;
      white-space: pre-wrap;
      opacity: 0;
      margin-top: 10px;
      overflow-y: auto;
      flex: 1;
      z-index: 1;
    }
  </style>
</head>
<body>

<div id="container">
  <div style="display:flex; align-items:center;">
    <input type="password" id="password-input" autofocus>
  </div>
  <div id="dictionary"></div>
</div>

<!-- CryptoJS for encryption/decryption -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<script>
  const dataFile = "dictionary.data";   // your encrypted file
  const secretKey = "mySecretKey123";   // 🔐 CHANGE THIS to your secret key

  const container = document.getElementById("container");
  const input = document.getElementById("password-input");
  const dict = document.getElementById("dictionary");

  async function getDecryptedPassword() {
    try {
      const res = await fetch(dataFile);
      const encrypted = await res.text();
      const bytes = CryptoJS.AES.decrypt(encrypted.trim(), secretKey);
      return bytes.toString(CryptoJS.enc.Utf8);
    } catch (err) {
      console.error("Failed to load encrypted file:", err);
      return "";
    }
  }

  input.addEventListener("keydown", async e => {
    if(e.key === "Enter"){
      const correctPassword = await getDecryptedPassword();
      if(input.value === correctPassword){
        container.classList.add("square");
        input.style.opacity = 0;

        setTimeout(() => {
          let i = 0;
          dict.style.opacity = 1;
          const dictionaryData = `
📖 Private Dictionary
------------------------
KuroSaru - (noun) A Japanese-inspired name meaning “Black Monkey”
Kokujin - (noun) Japanese term meaning “black person”
Janna - (slang'd-name) Someone fat
Kevin - (slang'd-name) Kevin is a slang term meaning "something bad"
Owen - (slang'd-name) meaning "something good"
Pica - (vulgar) Slovak insult, roughly equivalent to “bitch”
          `;
          (function typeDict(){
            if(i < dictionaryData.length){
              dict.textContent += dictionaryData[i++];
              setTimeout(typeDict, 15);
            }
          })();
        }, 900);
      } else {
        input.value = "";
        alert("Access denied. Try again.");
      }
    }
  });
</script>

</body>
</html>
