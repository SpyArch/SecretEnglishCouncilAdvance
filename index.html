<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secret English Council Advance</title>
<style>
  body {
    background:#000;
    color:#0f0;
    font-family:monospace;
    margin:0; overflow:hidden;
  }
  #container {
    width:0; height:0;
    border-radius:50%;
    background:#000;
    position:fixed; top:50%; left:50%;
    transform:translate(-50%,-50%);
    overflow:hidden; color:#0f0;
    transition:all 0.5s ease;
  }
  #container.open {
    width:80vw; height:80vh; border-radius:8px;
  }
  #menuArea { display:none; width:100%; height:100%; padding:12px; }
  #menuFlex { display:flex; height:100%; }
  #leftCol { width:180px; border-right:1px solid #0f0; padding:6px; }
  #rightCol {
    flex:1;
    padding-left:18px;
    padding-right:12px; /* scrollbar fix */
    overflow-y:auto;
  }
  .menu-item { cursor:pointer; margin:4px 0; }
  .menu-item.selected { color:#ff0; }
  .sub-item { margin-left:12px; }
  .sub-item.selected { color:#ff0; }
  .pwScreen { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; }
  .hidden { display:none; }
  #pwInput {
    background:#000; color:#0f0; border:1px solid #0f0;
    padding:6px; font-family:monospace; width:260px;
  }
</style>
</head>
<body>
<div id="container">
  <div id="menuArea">
    <div id="menuFlex">
      <div id="leftCol"></div>
      <div id="rightCol"></div>
    </div>
  </div>
</div>

<div id="pwPrompt" class="pwScreen">
  <div>ENTER PASSWORD:</div>
  <input type="password" id="pwInput">
</div>

<script>
const container=document.getElementById("container");
const menuArea=document.getElementById("menuArea");
const leftCol=document.getElementById("leftCol");
const rightCol=document.getElementById("rightCol");
const pwPrompt=document.getElementById("pwPrompt");
const pwInput=document.getElementById("pwInput");

let menu=["BOUNTY","MEDIA","DICTIONARY","EXIT"];
let submenus={
  "MEDIA":["DISCORD","INSTAGRAM","ROBLOX"]
};
let selected=0;
let inSub=false;
let subSel=0;
let activeMenu=null;

function typeText(el,text,done){
  el.textContent="";
  let i=0;
  function step(){
    if(i<text.length){
      el.textContent+=text[i];
      i++;
      setTimeout(step,30);
    } else if(done) done();
  }
  step();
}

function leftRender(){
  leftCol.innerHTML="";
  menu.forEach((m,i)=>{
    let d=document.createElement("div");
    d.className="menu-item"+(i===selected&&!inSub?" selected":"");
    d.textContent=(i===selected&&!inSub?"> ":"   ")+m;
    leftCol.appendChild(d);
  });
}

function rightRender(){
  rightCol.innerHTML="";
  let head=document.createElement("div");
  typeText(head,menu[selected]);
  rightCol.appendChild(head);

  if(inSub && activeMenu && submenus[activeMenu]){
    let sep=document.createElement("div");
    sep.textContent="----------------";
    rightCol.appendChild(sep);

    submenus[activeMenu].forEach((s,i)=>{
      let d=document.createElement("div");
      d.className="sub-item"+(i===subSel?" selected":"");
      d.textContent=(i===subSel?"> ":"   ")+s;
      rightCol.appendChild(d);
    });
  }
}

function renderAll(){ leftRender(); rightRender(); }

function openMenu(){
  container.classList.add("open");
  setTimeout(()=>{
    menuArea.style.display="block";
    renderAll();
  },500);
}
function closeMenu(){
  container.classList.remove("open");
  menuArea.style.display="none"; // hide immediately
}

function resetAll(){
  selected=0; subSel=0; inSub=false; activeMenu=null;
}

function exitMenu(){
  closeMenu();
  resetAll();
  pwPrompt.classList.remove("hidden");
  pwInput.value="";
  pwInput.focus();
}

function handleMainEnter(){
  let m=menu[selected];
  if(m==="EXIT"){ exitMenu(); return; }
  if(submenus[m]){
    inSub=true; subSel=0; activeMenu=m;
  }
  renderAll();
}

function handleSubEnter(){
  let sub=submenus[activeMenu][subSel];
  if(sub==="DISCORD") window.open("https://discord.com","_blank");
  if(sub==="INSTAGRAM") window.open("https://instagram.com","_blank");
  if(sub==="ROBLOX") window.open("https://roblox.com","_blank");
}

function handleKey(e){
  if(pwPrompt.classList.contains("hidden")){
    if(e.key==="w"||e.key==="ArrowUp"){
      if(!inSub){ selected=(selected-1+menu.length)%menu.length; }
      else { subSel=(subSel-1+submenus[activeMenu].length)%submenus[activeMenu].length; }
    }
    if(e.key==="s"||e.key==="ArrowDown"){
      if(!inSub){ selected=(selected+1)%menu.length; }
      else { subSel=(subSel+1)%submenus[activeMenu].length; }
    }
    if(e.key==="Enter"||e.key==="d"||e.key==="ArrowRight"){
      if(!inSub) handleMainEnter();
      else handleSubEnter();
    }
    if(e.key==="a"||e.key==="ArrowLeft"){
      if(inSub){ inSub=false; activeMenu=null; }
    }
    renderAll();
  }
}
document.addEventListener("keydown",handleKey);

// password
const secret="@2#1#3$1#1%1#1^3%2(2*1@2^2#3(1&1^3#3*1(2!2#2$3!2^3#3#1#2";
pwInput.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    if(pwInput.value===secret){
      pwPrompt.classList.add("hidden");
      openMenu();
    } else {
      alert("Wrong password");
      pwInput.value="";
    }
  }
});

// konami
let kseq=[]; let kode=["ArrowUp","ArrowUp","ArrowDown","ArrowDown","ArrowLeft","ArrowRight","ArrowLeft","ArrowRight","b","a"];
document.addEventListener("keydown",e=>{
  kseq.push(e.key);
  if(kseq.length>kode.length) kseq.shift();
  if(JSON.stringify(kseq)===JSON.stringify(kode)){
    window.open("https://www.youtube.com/watch?v=dQw4w9WgXcQ","_blank");
  }
});
</script>
</body>
</html>
