<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Secret Menu — Restored UI</title>
<style>
  /* Reset */
  * { box-sizing: border-box; margin:0; padding:0; }
  html,body { height:100%; background:#000; color:#fff; font-family:monospace; -webkit-font-smoothing:antialiased; }
  body { display:flex; align-items:center; justify-content:center; overflow:hidden; }

  /* Container (capsule -> rectangle) */
  #container {
    width:320px; height:56px;
    border:2px solid #fff; border-radius:28px;
    background:#000; display:flex; align-items:center; justify-content:center;
    transition: width 0.55s cubic-bezier(.2,.9,.2,1), height 0.55s cubic-bezier(.2,.9,.2,1), border-radius .45s;
    overflow:hidden; transform-origin:center;
  }

  /* Hyprland open/close */
  @keyframes hypr-open { from { transform:scale(.98); opacity:0 } to { transform:scale(1); opacity:1 } }
  @keyframes hypr-close { from { transform:scale(1); opacity:1 } to { transform:scale(.98); opacity:0 } }
  .anim-opening { animation: hypr-open 260ms ease both; }
  .anim-closing { animation: hypr-close 220ms ease both; }

  /* Open / menu state */
  #container.open {
    width:88vw; max-width:980px; height:72vh; max-height:720px; border-radius:12px; padding:12px;
  }

  /* Password capsule */
  #pwSection { width:100%; padding:8px; display:flex; justify-content:center; align-items:center; }
  #password {
    width:86%; background:transparent; border:none; outline:none; color:#fff; font-size:18px; text-align:center; caret-color:#fff;
  }

  /* Menu area (hidden until open) */
  #menuArea { display:none; width:100%; height:100%; }
  #container.open #menuArea { display:flex; }
  #container.open #pwSection { display:none; }

  /* Left menu column */
  #leftCol { width:260px; max-width:34%; min-width:160px; border-right:2px solid #fff; padding-right:12px; display:flex; flex-direction:column; gap:8px; }
  .left-item { padding:8px 6px; cursor:pointer; user-select:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#fff; }
  /* main-mode left indicator (only visible in main mode) */
  .left-item.main-selected::before { content: "> "; margin-right:6px; color:#fff; }

  /* Right panel (detail) */
  #rightCol { flex:1; padding-left:18px; overflow-y:auto; white-space:pre-wrap; font-size:15px; line-height:1.4; position:relative; }
  #rightCol::-webkit-scrollbar { height:8px; width:8px; background:transparent; }
  #rightCol::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius:4px; }
  #rightCol { -ms-overflow-style: none; scrollbar-width: thin; }

  /* Sub-items inside detail column */
  .detail-line { position:relative; padding:6px 0 6px 28px; cursor:pointer; user-select:none; color:#fff; }
  /* sub-mode indicator shown on right (only when in sub-mode) */
  .detail-line.sub-selected::before { content: "> "; position:absolute; left:6px; top:6px; }

  /* detail plain lines (no selection) */
  .detail-line.plain { padding-left:6px; }

  /* small screens */
  @media (max-width:520px) {
    #container.open { width:94vw; height:78vh; padding:8px; }
    #leftCol { width:40%; max-width:180px; }
  }
</style>
</head>
<body>

<div id="container" aria-live="polite">
  <!-- Password capsule -->
  <div id="pwSection">
    <input id="password" type="password" placeholder="Enter password" autocomplete="off" />
  </div>

  <!-- Menu area (hidden until unlocked) -->
  <div id="menuArea" aria-hidden="true" style="display:flex; width:100%; height:100%;">
    <div id="leftCol" role="menu" aria-label="Main menu"></div>
    <div id="rightCol" role="region" aria-label="Detail panel"></div>
  </div>
</div>

<script>
/* ================= CONFIG ================= */
const CORRECT_PASSWORD = "@2#1#3$1#1%1#1^3%2(2*1@2^2#3(1&1^3#3*1(2!2#2$3!2^3#3#1#2";

/* Media links */
const MEDIA = [
  {name:"DISCORD", url:"https://discord.gg/Bz2z7hqeb"},
  {name:"INSTAGRAM", url:"https://www.instagram.com/secreteng_counciladvanced/"},
  {name:"ROBLOX", url:"https://www.roblox.com/share/g/35306961"}
];

/* Bounty spreadsheet */
const BOUNTIES = [
  ["Name","Bounty"],
  ["Janna", 2900000000],
  ["Sabrina",2400000000],
  ["Juan",400000000],
  ["Angel",1700000000],
  ["Aubrey",700000000]
];

/* Dictionary text (exact) */
const DICTIONARY_TEXT = `KuroSaru - (noun) A Japanese-inspired name meaning “Black Monkey”
Kokujin - (noun) Japanese term meaning “black person”
Airball - Filipino Starter Pack (also known as Feyleypenos)
Gerald - Someone Black
Janna - (slang'd-name) Someone fat
Kevin - (slang'd-name) Kevin is a slang term meaning "something bad"
Owen - (slang'd-name) meaning "something good"
Pica - (vulgar) Slovak insult, roughly equivalent to “bitch”`;

/* Menu model */
const MENU = [
  { key:"BOUNTY", label:"BOUNTY" },
  { key:"MEDIA", label:"MEDIA", submenu: MEDIA },
  { key:"DICTIONARY", label:"DICTIONARY" },
  { key:"EXIT", label:"EXIT" }
];

/* Konami (W W S S A D A D B A Enter) */
const KONAMI = ["w","w","s","s","a","d","a","d","b","a","enter"];
const RICKROLL = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
/* ========================================== */

/* DOM refs */
const container = document.getElementById("container");
const pwInput = document.getElementById("password");
const menuArea = document.getElementById("menuArea");
const leftCol = document.getElementById("leftCol");
const rightCol = document.getElementById("rightCol");

/* State */
let mode = "locked"; // 'locked' | 'main' | 'sub'
let selectedMenu = 0;
let selectedDetail = 0;
let konamiBuf = [];
let lastRenderSig = ""; // prevent re-typing when not needed

/* Helpers */
function normalizeKey(e) {
  if (!e) return "";
  if (e.key === "ArrowUp") return "w";
  if (e.key === "ArrowDown") return "s";
  if (e.key === "ArrowLeft") return "a";
  if (e.key === "ArrowRight") return "d";
  if (e.key === "Enter") return "enter";
  return (""+e.key).toLowerCase();
}
function pushKonami(k) {
  konamiBuf.push(k);
  if (konamiBuf.length > KONAMI.length) konamiBuf.shift();
  if (konamiBuf.length === KONAMI.length) {
    if (KONAMI.every((v,i)=>konamiBuf[i]===v)) { window.open(RICKROLL, "_blank"); konamiBuf = []; }
  }
}
function formatMoney(n) { try { return "$" + Number(n).toLocaleString("en-US"); } catch(e) { return "$"+n; } }

/* Typing utilities */
function sleep(ms){ return new Promise(res=>setTimeout(res,ms)); }
async function typeTextInto(el, text, speed=8) {
  el.textContent = "";
  for (let i=0;i<text.length;i++){
    el.textContent += text[i];
    await sleep(speed);
  }
}
async function typeNodesSequential(nodes, texts, speed=8, gap=60) {
  for (let i=0;i<nodes.length;i++){
    nodes[i].textContent = "";
    for (let j=0;j<texts[i].length;j++){
      nodes[i].textContent += texts[i][j];
      await sleep(speed);
    }
    await sleep(gap);
  }
}

/* Rendering */
function leftRender() {
  leftCol.innerHTML = "";
  MENU.forEach((m,i)=>{
    const div = document.createElement("div");
    div.className = "left-item";
    div.textContent = m.label;
    if (mode === "main" && i === selectedMenu) div.classList.add("main-selected");
    // click/tap behavior
    div.addEventListener("click", ()=> {
      if (mode === "locked") return;
      if (selectedMenu === i) {
        // second click toggles enter if has submenu else show content / exit
        if (m.submenu) {
          // enter submode
          if (mode !== "sub") { mode = "sub"; selectedDetail = 0; lastRenderSig = ""; renderAll(); }
        } else if (m.key === "EXIT") {
          closeAndReset();
        } else {
          mode = "main"; lastRenderSig=""; renderAll();
        }
      } else {
        selectedMenu = i; mode = "main"; lastRenderSig=""; renderAll();
      }
    });
    div.addEventListener("touchstart", (ev)=> { ev.preventDefault(); div.click(); }, {passive:false});
    leftCol.appendChild(div);
  });
}

/* Build right content depending on mode & selection.
   Use lastRenderSig to avoid retyping when nothing changed (fix scrambled letters).
*/
async function rightRender() {
  const sig = `${mode}|${selectedMenu}|${selectedDetail}`;
  if (sig === lastRenderSig) return; // nothing changed -> don't retype
  lastRenderSig = sig;

  rightCol.innerHTML = ""; // clear quickly

  const menuItem = MENU[selectedMenu];

  // SUBMODE for MEDIA: show right column as list with sub-selected arrow (Option B style: arrow and a little left padding)
  if (mode === "sub" && menuItem.submenu) {
    const nodes = [];
    for (let i=0;i<menuItem.submenu.length;i++){
      const d = document.createElement("div");
      d.className = "detail-line";
      // leaving text empty to type into
      d.addEventListener("click", ()=> {
        const url = menuItem.submenu[i].url;
        if (url) window.open(url, "_blank");
      });
      d.addEventListener("touchstart", ()=> { selectedDetail = i; renderAll(); }, {passive:true});
      rightCol.appendChild(d);
      nodes.push(d);
    }
    // prepare display texts: selected line gets leading ">  " style, others get two-space indent
    const texts = menuItem.submenu.map((m,i)=> (i===selectedDetail ? `>  ${m.name}` : `   ${m.name}`));
    // perform typing sequentially
    await typeNodesSequential(nodes, texts, 7, 40);
    // restore classes for selection visuals (so CSS can still show marker if needed)
    nodes.forEach((n,i)=> {
      n.classList.toggle("sub-selected", i===selectedDetail);
    });
    return;
  }

  // MAIN MODE: render the content for DICTIONARY / BOUNTY / MEDIA (plain list) or EXIT hint
  if (menuItem.key === "DICTIONARY") {
    const pre = document.createElement("pre"); pre.style.margin = "0";
    rightCol.appendChild(pre);
    await typeTextInto(pre, DICTIONARY_TEXT, 7);
    return;
  }

  if (menuItem.key === "BOUNTY") {
    // produce lines with commas and $ and type them
    const lines = BOUNTIES.map((r,idx)=> {
      if (idx===0) return r.join(", ");
      return `${r[0]}, ${formatMoney(r[1])}`;
    });
    const nodes = lines.map(()=> {
      const d = document.createElement("div");
      d.className = "detail-line plain";
      rightCol.appendChild(d);
      return d;
    });
    await typeNodesSequential(nodes, lines, 8, 40);
    return;
  }

  if (menuItem.key === "MEDIA") {
    // show plain names (main mode view) and type them quickly
    const nodes = MEDIA.map(()=> {
      const d = document.createElement("div");
      d.className = "detail-line plain";
      rightCol.appendChild(d);
      return d;
    });
    const texts = MEDIA.map(m=>m.name);
    await typeNodesSequential(nodes, texts, 8, 35);
    return;
  }

  if (menuItem.key === "EXIT") {
    const d = document.createElement("div");
    rightCol.appendChild(d);
    await typeTextInto(d, "Press Enter to return to password prompt.", 10);
    return;
  }
}

/* One-shot render wrapper */
function renderAll() {
  leftRender();
  rightRender(); // async; fire & forget
}

/* Open / Close sequences */
function openSequence() {
  container.classList.remove("anim-closing");
  container.classList.add("anim-opening");
  setTimeout(()=> {
    container.classList.add("open");
    setTimeout(()=> container.classList.remove("anim-opening"), 300);
  }, 10);
  mode = "main"; selectedMenu = 0; selectedDetail = 0; lastRenderSig = "";
  menuArea.setAttribute("aria-hidden","false");
  setTimeout(()=> renderAll(), 300);
}
function closeAndReset() {
  container.classList.add("anim-closing");
  container.classList.remove("anim-opening");
  container.classList.remove("open");
  menuArea.setAttribute("aria-hidden","true");
  setTimeout(()=> {
    container.classList.remove("anim-closing");
    mode = "locked"; selectedMenu = 0; selectedDetail = 0; lastRenderSig = "";
    rightCol.innerHTML = "";
    // reset password input
    pwInput.value = "";
    setTimeout(()=> pwInput.focus(), 180);
    renderAll();
    // clear konami buffer
    konamiBuf = [];
  }, 260);
}

/* Key handling */
function handleKey(e) {
  const nk = normalizeKey(e);
  pushKonami(nk);

  if (mode === "locked") return;

  // prevent default scrolling when using arrows/wasd/enter
  if (["w","s","a","d","enter"].includes(nk)) e.preventDefault();

  if (mode === "main") {
    if (nk === "w") { selectedMenu = (selectedMenu -1 + MENU.length) % MENU.length; lastRenderSig=""; renderAll(); return; }
    if (nk === "s") { selectedMenu = (selectedMenu +1) % MENU.length; lastRenderSig=""; renderAll(); return; }
    if (nk === "d" || nk === "enter") {
      const m = MENU[selectedMenu];
      if (m.submenu) { mode = "sub"; selectedDetail = 0; lastRenderSig=""; renderAll(); return; }
      if (m.key === "EXIT") { closeAndReset(); return; }
      // DICTIONARY/BOUNTY: show content (retype)
      lastRenderSig = ""; renderAll(); return;
    }
    // 'a' does nothing in main
    return;
  }

  if (mode === "sub") {
    const m = MENU[selectedMenu];
    if (!m.submenu) { mode="main"; lastRenderSig=""; renderAll(); return; } // fallback
    const len = m.submenu.length;
    if (nk === "w") { selectedDetail = (selectedDetail -1 + len) % len; lastRenderSig=""; renderAll(); return; }
    if (nk === "s") { selectedDetail = (selectedDetail +1) % len; lastRenderSig=""; renderAll(); return; }
    if (nk === "a") { // go back to main
      mode = "main"; selectedDetail = 0; lastRenderSig=""; renderAll(); return;
    }
    if (nk === "d") {
      // IMPORTANT: when in sub-mode, RIGHT opens the link directly (no re-render)
      const chosen = m.submenu[selectedDetail];
      if (chosen && chosen.url) window.open(chosen.url, "_blank");
      return;
    }
    if (nk === "enter") {
      const chosen = m.submenu[selectedDetail];
      if (chosen && chosen.url) window.open(chosen.url, "_blank");
      return;
    }
  }
}

/* Password input handler */
pwInput.addEventListener("keydown", (ev)=> {
  const nk = normalizeKey(ev);
  pushKonami(nk);
  if (ev.key === "Enter") {
    ev.preventDefault();
    if (pwInput.value === CORRECT_PASSWORD) {
      openSequence();
      // hide input visually after short delay (container handles showing menuArea)
      setTimeout(()=> { pwInput.blur(); }, 260);
    } else {
      pwInput.value = "";
      // small visual shake could be added; simple alert is enough
      alert("Access denied.");
    }
  }
});

/* Global listener for menu navigation */
document.addEventListener("keydown", handleKey);

/* Build initial left DOM (static items) */
function buildLeft() {
  leftCol.innerHTML = "";
  MENU.forEach((m,i)=>{
    const el = document.createElement("div");
    el.className = "left-item";
    el.textContent = m.label;
    el.addEventListener("click", ()=> {
      if (mode === "locked") return;
      if (selectedMenu === i) {
        // second click: if submenu exists, enter it; if EXIT -> reset; else show content
        if (m.submenu) {
          if (mode !== "sub") { mode="sub"; selectedDetail=0; lastRenderSig=""; renderAll(); }
        } else if (m.key === "EXIT") { closeAndReset(); }
        else { mode="main"; lastRenderSig=""; renderAll(); }
      } else {
        selectedMenu = i; mode="main"; lastRenderSig=""; renderAll();
      }
    });
    el.addEventListener("touchstart", (ev)=> { ev.preventDefault(); el.click(); }, {passive:false});
    leftCol.appendChild(el);
  });
}

/* Click on right column delegation (sub items) */
rightCol.addEventListener("click", (ev)=> {
  const node = ev.target.closest(".detail-line");
  if (!node) return;
  // identify index among detail lines
  const children = Array.from(rightCol.querySelectorAll(".detail-line"));
  const idx = children.indexOf(node);
  if (mode === "sub") {
    const chosen = MENU[selectedMenu].submenu[idx];
    if (chosen && chosen.url) window.open(chosen.url,"_blank");
  }
});

/* Initialize */
function init() {
  buildLeft();
  renderAll(); // initial render (locked shows nothing)
  setTimeout(()=> pwInput.focus(), 80);
}
init();

</script>
</body>
</html>
