<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secret Menu</title>
<style>
/* --- Basic Reset --- */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; width: 100%; }
body {
  background-color: #000;
  color: #fff;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* --- App Container --- */
#app {
  width: 300px;
  height: 60px;
  border: 2px solid #fff;
  border-radius: 25px;
  overflow: hidden;
  position: relative;
  transition: all 0.5s ease;
}
#app.menu {
  width: 80vw;
  max-width: 800px;
  height: 80vh;
  border-radius: 0;
  display: flex;
}

/* --- Login Screen --- */
#login-screen {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
#password-input {
  width: 200px;
  padding: 10px 15px;
  font-size: 16px;
  color: #fff;
  background: transparent;
  border: 2px solid #fff;
  border-radius: 25px;
  outline: none;
}
#password-input::placeholder { color: #fff; opacity: 0.7; }
#login-button { display: none; }

/* --- Main Menu --- */
#main-menu {
  display: flex;
  width: 100%;
  height: 100%;
  opacity: 0;
  transition: opacity 0.3s ease 0.5s;
}
#app.menu #main-menu { opacity: 1; }

/* --- Panels --- */
#left-panel {
  width: 200px;
  min-width: 150px;
  border-right: 2px solid #fff;
  padding: 10px;
}
#menu-list, #submenu-list {
  list-style: none;
}
#menu-list li, #submenu-list li {
  padding: 5px 10px;
  cursor: pointer;
  position: relative;
}
#menu-list li.selected::before { content: "> "; }
#submenu-list li.selected::before { content: "> "; }

/* --- Right Panel (Submenu/Content) --- */
#right-panel {
  flex: 1;
  padding: 10px;
  position: relative;
}

/* --- Submenu List --- */
#submenu-list { display: none; margin-left: 20px; }

/* --- Bounty Table --- */
#bounty-table {
  width: 100%;
  border-collapse: collapse;
}
#bounty-table th, #bounty-table td {
  border: 1px solid #fff;
  padding: 5px 10px;
  text-align: left;
}

/* --- Hidden Sections --- */
.hidden { display: none; }

/* --- Responsive --- */
@media (max-width: 600px) {
  #left-panel { width: 120px; }
  #menu-list li, #submenu-list li { font-size: 14px; padding: 5px; }
}
</style>
</head>
<body>
<div id="app">
  <!-- Login Screen -->
  <div id="login-screen">
    <form id="login-form">
      <input type="password" id="password-input" placeholder="Enter Password" required autofocus>
      <button type="submit" id="login-button">Enter</button>
    </form>
  </div>

  <!-- Main Menu -->
  <div id="main-menu" class="hidden">
    <div id="left-panel">
      <ul id="menu-list">
        <li data-index="0">BOUNTY</li>
        <li data-index="1">MEDIA</li>
        <li data-index="2">DICTIONARY</li>
        <li data-index="3">EXIT</li>
      </ul>
    </div>
    <div id="right-panel">
      <ul id="submenu-list"></ul>
      <div id="bounty-content" class="hidden">
        <table id="bounty-table">
          <tr><th>Name</th><th>Bounty</th></tr>
          <tr><td>SpyPro</td><td>$9000</td></tr>
          <tr><td>Shadow</td><td>$7000</td></tr>
          <tr><td>Ghost</td><td>$5000</td></tr>
        </table>
      </div>
      <div id="dictionary-content" class="hidden">
        <p>cryptography: the art of writing or solving codes.</p>
        <p>encryption: converting information into secret codes.</p>
      </div>
    </div>
  </div>
</div>

<script>
let loggedIn = false;
let mainIndex = 0;
let subIndex = 0;
let inSubmenu = false;
const keyBuffer = [];
const konamiCode = ['w','w','s','s','a','d','a','d','b','a','enter'];

const loginForm = document.getElementById('login-form');
const passwordInput = document.getElementById('password-input');
const app = document.getElementById('app');
const loginScreen = document.getElementById('login-screen');
const mainMenu = document.getElementById('main-menu');
const menuItems = document.querySelectorAll('#menu-list li');
const rightPanel = document.getElementById('right-panel');
const submenu = document.getElementById('submenu-list');
const bountyContent = document.getElementById('bounty-content');
const dictionaryContent = document.getElementById('dictionary-content');

// Media submenu links
const mediaLinks = [
  {name:'DISCORD', url:'https://discord.gg/yourserver'},
  {name:'INSTAGRAM', url:'https://instagram.com/yourprofile'},
  {name:'ROBLOX', url:'https://www.roblox.com/users/123456789/profile'}
];

// --- Login ---
loginForm.addEventListener('submit', e=>{
  e.preventDefault();
  if(passwordInput.value === "S3cr3tOldPass!2025") openMenu();
  else { alert("Incorrect password."); passwordInput.value=""; }
});

function openMenu(){
  loggedIn = true;
  app.classList.add('menu');
  loginScreen.classList.add('hidden');
  mainMenu.classList.remove('hidden');
  mainIndex = 0;
  selectMainItem(mainIndex);
}

// --- Main menu selection ---
function selectMainItem(idx){
  menuItems.forEach(li=>li.classList.remove('selected'));
  menuItems[idx].classList.add('selected');
}

// --- Submenu selection ---
function selectSubItem(idx){
  const items = submenu.querySelectorAll('li');
  items.forEach(li=>li.classList.remove('selected'));
  items[idx].classList.add('selected');
}

// --- Clear content & submenu ---
function clearContent(){
  bountyContent.classList.add('hidden');
  dictionaryContent.classList.add('hidden');
  submenu.style.display='none';
  submenu.innerHTML='';
  inSubmenu=false;
  subIndex=0;
}

// --- Show bounty ---
function showBounty(){ clearContent(); bountyContent.classList.remove('hidden'); }

// --- Show dictionary ---
function showDictionary(){ clearContent(); dictionaryContent.classList.remove('hidden'); }

// --- Show media submenu ---
function showMediaSubmenu(){
  clearContent();
  mediaLinks.forEach((link, idx)=>{
    const li = document.createElement('li');
    li.textContent = link.name;
    li.dataset.index = idx;
    submenu.appendChild(li);
  });
  submenu.style.display='block';
  inSubmenu=true;
  subIndex=0;
  selectSubItem(subIndex);
}

// --- Exit ---
function exitMenu(){ clearContent(); mainMenu.classList.add('hidden'); loginScreen.classList.remove('hidden'); app.classList.remove('menu'); loggedIn=false; mainIndex=0; keyBuffer.length=0; passwordInput.focus(); }

// --- Open media link ---
function openMediaLink(idx){ window.open(mediaLinks[idx].url,'_blank'); }

// --- Navigation ---
document.addEventListener('keydown', e=>{
  if(!loggedIn) return;
  let key = e.key.toLowerCase();
  if(key==='arrowup') key='w';
  if(key==='arrowdown') key='s';
  if(key==='arrowleft') key='a';
  if(key==='arrowright') key='d';
  trackKonami(key);

  if(key==='w'){
    if(inSubmenu && subIndex>0){ subIndex--; selectSubItem(subIndex); }
    else if(!inSubmenu && mainIndex>0){ mainIndex--; selectMainItem(mainIndex); }
    e.preventDefault();
  }else if(key==='s'){
    if(inSubmenu && subIndex<submenu.querySelectorAll('li').length-1){ subIndex++; selectSubItem(subIndex); }
    else if(!inSubmenu && mainIndex<menuItems.length-1){ mainIndex++; selectMainItem(mainIndex); }
    e.preventDefault();
  }else if(key==='a'){
    if(inSubmenu){ inSubmenu=false; submenu.style.display='none'; selectMainItem(mainIndex); }
    e.preventDefault();
  }else if(key==='d' || key==='enter'){
    if(inSubmenu) openMediaLink(subIndex);
    else handleMainEnter();
    e.preventDefault();
  }
});

// --- Main menu enter ---
function handleMainEnter(){
  if(mainIndex===0) showBounty();
  else if(mainIndex===1) showMediaSubmenu();
  else if(mainIndex===2) showDictionary();
  else if(mainIndex===3) exitMenu();
}

// --- Konami code ---
function trackKonami(key){
  keyBuffer.push(key);
  if(keyBuffer.length>konamiCode.length) keyBuffer.shift();
  if(keyBuffer.length===konamiCode.length && konamiCode.every((k,i)=>keyBuffer[i]===k)){
    window.open('https://www.youtube.com/watch?v=dQw4w9WgXcQ','_blank');
    keyBuffer.length=0;
  }
}

// --- Click navigation ---
menuItems.forEach(li=>{
  li.addEventListener('click', ()=>{
    mainIndex=parseInt(li.dataset.index);
    selectMainItem(mainIndex);
    handleMainEnter();
  });
});
submenu.addEventListener('click', e=>{
  if(e.target.tagName==='LI') openMediaLink(parseInt(e.target.dataset.index));
});
</script>
</body>
</html>
