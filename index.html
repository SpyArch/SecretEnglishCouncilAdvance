<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Menu — Responsive</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;width:100%;background:#000;color:#fff;font-family:monospace;display:flex;align-items:center;justify-content:center;}
  
  #container{
    width:80vw; max-width:980px;
    min-width:320px;
    height:60px;
    border:2px solid #fff; border-radius:28px;
    background:#000;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;position:relative;transition:all 0.5s ease;
  }
  #container.open{
    height:72vh; min-height:300px; max-height:90vh;
    border-radius:0;
    padding:12px;
    flex-direction:row;
  }

  #pwSection{
    width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  }
  #password{
    width:86%;background:transparent;border:none;color:#fff;font-size:18px;text-align:center;caret-color:#fff;outline:none;box-shadow:none;
  }
  #password::placeholder{color:#fff;opacity:0.7;}
  
  #menuArea{display:none;width:100%;height:100%;flex-direction:row;gap:12px;}
  #container.open #menuArea{display:flex;}
  #container.open #pwSection{display:none;}

  #leftCol{
    width:30%; min-width:160px; max-width:260px;
    border-right:2px solid #fff;
    display:flex;flex-direction:column;gap:6px;overflow-y:auto;
  }
  .left-item{padding:8px 6px;cursor:pointer;user-select:none;}
  .left-item.main-selected::before{content:"> ";margin-right:6px;color:#fff;}

  #rightCol{
    flex:1; overflow-y:auto; white-space:pre-wrap; font-size:15px; line-height:1.4;
    max-height:100%;
  }
  #rightCol::-webkit-scrollbar{width:8px;background:transparent;}
  #rightCol::-webkit-scrollbar-thumb{background: rgba(255,255,255,0.06);border-radius:4px;}
  .detail-line{position:relative;padding:6px 0 6px 28px;cursor:pointer;user-select:none;}
  .detail-line.sub-selected::before{content:"> ";position:absolute;left:6px;top:6px;}
  .detail-line.plain{padding-left:6px;}
  @media(max-width:600px){
    #container.open{flex-direction:column;height:80vh;}
    #leftCol{width:100%; max-width:100%; border-right:none; border-bottom:2px solid #fff; padding-bottom:6px;}
    #rightCol{padding-top:6px;}
    .left-item,.detail-line{font-size:14px;padding:4px 4px;}
  }
</style>
</head>
<body>
<div id="container">
  <div id="pwSection">
    <input id="password" type="password" placeholder="Enter password" autocomplete="off" />
  </div>
  <div id="menuArea">
    <div id="leftCol"></div>
    <div id="rightCol"></div>
  </div>
</div>
<script>
const CORRECT_PASSWORD="@2#1#3$1#1%1#1^3%2(2*1@2^2#3(1&1^3#3*1(2!2#2$3!2^3#3#1#2";
const MENU=[
  {key:"BOUNTY",label:"BOUNTY"},
  {key:"MEDIA",label:"MEDIA",submenu:[
    {name:"DISCORD",url:"https://discord.gg/Bz2z7hqeb"},
    {name:"INSTAGRAM",url:"https://www.instagram.com/secreteng_counciladvanced/"},
    {name:"ROBLOX",url:"https://www.roblox.com/share/g/35306961"}
  ]},
  {key:"DICTIONARY",label:"DICTIONARY"},
  {key:"EXIT",label:"EXIT"}
];
const BOUNTIES=[
  ["Name","Bounty"],
  ["Janna",2900000000],
  ["Sabrina",2400000000],
  ["Juan",400000000],
  ["Angel",1700000000],
  ["Aubrey",700000000]
];
const DICTIONARY_TEXT=`KuroSaru - (noun) A Japanese-inspired name meaning “Black Monkey”
Kokujin - (noun) Japanese term meaning “black person”
Airball - Filipino Starter Pack (also known as Feyleypenos)
Gerald - Someone Black
Janna - (slang'd-name) Someone fat
Kevin - (slang'd-name) meaning "something bad"
Owen - (slang'd-name) meaning "something good"
Pica - (vulgar) Slovak insult, roughly equivalent to “bitch”`;

const container=document.getElementById("container");
const pwInput=document.getElementById("password");
const menuArea=document.getElementById("menuArea");
const leftCol=document.getElementById("leftCol");
const rightCol=document.getElementById("rightCol");

let mode="locked",selectedMenu=0,selectedDetail=0,lastRenderSig="",konamiBuf=[];
const KONAMI=["w","w","s","s","a","d","a","d","b","a","enter"];
const RICKROLL="https://www.youtube.com/watch?v=dQw4w9WgXcQ";

function normalizeKey(e){
  if(!e) return "";
  if(e.key==="ArrowUp")return"w";
  if(e.key==="ArrowDown")return"s";
  if(e.key==="ArrowLeft")return"a";
  if(e.key==="ArrowRight")return"d";
  if(e.key==="Enter")return"enter";
  return(""+e.key).toLowerCase();
}
function pushKonami(k){
  konamiBuf.push(k);
  if(konamiBuf.length>KONAMI.length) konamiBuf.shift();
  if(konamiBuf.length===KONAMI.length && KONAMI.every((v,i)=>konamiBuf[i]===v)){window.open(RICKROLL,"_blank"); konamiBuf=[];}
}

pwInput.addEventListener("keydown",(ev)=>{
  const k=normalizeKey(ev); pushKonami(k);
  if(k==="enter"){ev.preventDefault(); if(pwInput.value===CORRECT_PASSWORD) openMenu(); else{alert("Access denied."); pwInput.value="";}}
});

function openMenu(){
  container.classList.add("open");
  mode="main"; selectedMenu=0; selectedDetail=0; lastRenderSig=""; menuArea.setAttribute("aria-hidden","false"); pwInput.blur(); pwInput.value=""; renderAll();
}

function leftRender(){
  leftCol.innerHTML="";
  MENU.forEach((m,i)=>{
    const div=document.createElement("div"); div.className="left-item"; div.textContent=m.label;
    if(mode==="main" && i===selectedMenu) div.classList.add("main-selected");
    div.addEventListener("click",()=>{selectedMenu=i;mode="main";lastRenderSig=""; renderAll();});
    leftCol.appendChild(div);
  });
}

function rightRender(){
  rightCol.innerHTML="";
  const sig=`${mode}|${selectedMenu}|${selectedDetail}`;
  if(sig===lastRenderSig) return;
  lastRenderSig=sig;
  const selM=MENU[selectedMenu];
  if(selM.key==="BOUNTY"){BOUNTIES.forEach(row=>{const line=document.createElement("div"); line.className="detail-line plain"; line.textContent=row.join ? row.join(" | ") : row; rightCol.appendChild(line);});}
  else if(selM.key==="MEDIA"){selM.submenu.forEach((s,i)=>{const line=document.createElement("div"); line.className="detail-line"; if(i===selectedDetail) line.classList.add("sub-selected"); line.textContent=s.name; line.addEventListener("click",()=>window.open(s.url,"_blank")); rightCol.appendChild(line);});}
  else if(selM.key==="DICTIONARY"){DICTIONARY_TEXT.split("\n").forEach(l=>{const line=document.createElement("div"); line.className="detail-line plain"; line.textContent=l; rightCol.appendChild(line);});}
  else if(selM.key==="EXIT"){const line=document.createElement("div"); line.className="detail-line plain"; line.textContent="Press Enter to exit."; rightCol.appendChild(line);}
}

function renderAll(){leftRender(); rightRender();}

document.addEventListener("keydown",(ev)=>{
  const k=normalizeKey(ev); pushKonami(k);
  if(mode!=="main") return;
  const selM=MENU[selectedMenu];
  if(k==="w"){if(selM.submenu && selectedDetail>0) selectedDetail--; else if(!selM.submenu && selectedMenu>0){selectedMenu--;selectedDetail=0;}}
  if(k==="s"){if(selM.submenu && selectedDetail<selM.submenu.length-1) selectedDetail++; else if(!selM.submenu && selectedMenu<MENU.length-1){selectedMenu++;selectedDetail=0;}}
  if(k==="a") selectedDetail=0;
  if(k==="d"||k==="enter"){
    if(selM.key==="EXIT"){closeMenu(); return;}
    if(selM.key==="MEDIA" && selM.submenu) window.open(selM.submenu[selectedDetail].url,"_blank");
  }
  renderAll();
});

function closeMenu(){container.classList.remove("open"); menuArea.setAttribute("aria-hidden","true"); mode="locked"; pwInput.focus();}
</script>
</body>
</html>
