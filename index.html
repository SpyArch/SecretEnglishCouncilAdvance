<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Protected Interface</title>
<style>
    * { box-sizing: border-box; margin:0; padding:0; }
    html, body { height: 100%; background: black; color: white; font-family: monospace; }
    body { display: flex; justify-content: center; align-items: center; overflow: hidden; }

    /* Container (capsule -> rectangle) */
    #container {
        width: 300px;
        height: 40px;
        border: 2px solid white;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: width 0.5s ease, height 0.5s ease, border-radius 0.5s ease;
        overflow: hidden;
    }
    /* Password input section */
    #passwordSection { flex: 1; padding: 5px; }
    #passwordInput {
        width: 100%;
        background: transparent;
        border: none;
        outline: none;
        color: white;
        font-family: monospace;
        font-size: 1rem;
    }
    /* Menu section hidden initially */
    #menuSection { display: none; width: 100%; height: 100%; padding: 10px; flex-direction: row; }
    /* Expanded container style */
    #container.menu-open {
        width: 80vw;
        max-width: 700px;
        min-width: 300px;
        height: 60vh;
        max-height: 300px;
        min-height: 200px;
        border-radius: 10px;
    }
    #container.menu-open #menuSection { display: flex; }
    #container.menu-open #passwordSection { display: none; }
    /* Left menu list */
    #menuList { width: 150px; display: flex; flex-direction: column; align-items: flex-start; }
    .menuItem { padding: 5px 10px; font-family: monospace; }
    .menuItem.selected::before { content: "> "; }
    /* Right detail panel */
    #detailPanel { flex: 1; padding: 5px 10px; border-left: 1px solid white; margin-left: 10px; white-space: pre-wrap; overflow-y: auto; }
    /* Hide scrollbars */
    #detailPanel::-webkit-scrollbar { width: 0; background: transparent; }
    #detailPanel { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>
<body>
<div id="container">
    <div id="passwordSection">
        <input type="password" id="passwordInput" placeholder="Password" autofocus>
    </div>
    <div id="menuSection">
        <div id="menuList">
            <div class="menuItem selected">BOUNTY</div>
            <div class="menuItem">MEDIA</div>
            <div class="menuItem">DICTIONARY</div>
            <div class="menuItem">EXIT</div>
        </div>
        <div id="detailPanel"></div>
    </div>
</div>
<script>
    const password = "@2#1#3$1#1%1#1^3%2(2*1@2^2#3(1&1^3#3*1(2!2#2$3!2^3#3#1#2";
    const dictionaryContent = `📖 Private Dictionary
------------------------
KuroSaru - (noun) A Japanese-inspired name meaning “Black Monkey”
Kokujin - (noun) Japanese term meaning “black person”
Airball - Filipino Starter Pack (also known as Feyleypenos)
Gerald - Someone Black
Janna - (slang'd-name) Someone fat
Kevin - (slang'd-name) Kevin is a slang term meaning "something bad"
Owen - (slang'd-name) meaning "something good"
Pica - (vulgar) Slovak insult, roughly equivalent to “bitch”`;

    const container = document.getElementById("container");
    const pwInput = document.getElementById("passwordInput");
    const menuItems = Array.from(document.querySelectorAll(".menuItem"));
    const detailPanel = document.getElementById("detailPanel");
    let selectedIndex = 0;

    // Enter to unlock menu
    pwInput.addEventListener("keydown", e => {
        if(e.key === "Enter"){
            e.preventDefault();
            if(pwInput.value === password){
                container.classList.add("menu-open");
                pwInput.blur();
            } else {
                alert("Access denied");
                pwInput.value = "";
            }
        }
    });

    // Menu navigation
    document.addEventListener("keydown", e => {
        if(!container.classList.contains("menu-open")) return;
        if(e.key === "w" || e.key === "W"){
            e.preventDefault();
            menuItems[selectedIndex].classList.remove("selected");
            selectedIndex = (selectedIndex - 1 + menuItems.length) % menuItems.length;
            menuItems[selectedIndex].classList.add("selected");
        }
        if(e.key === "s" || e.key === "S"){
            e.preventDefault();
            menuItems[selectedIndex].classList.remove("selected");
            selectedIndex = (selectedIndex + 1) % menuItems.length;
            menuItems[selectedIndex].classList.add("selected");
        }
        if(e.key === "Enter"){
            e.preventDefault();
            const selected = menuItems[selectedIndex].textContent.trim();
            if(selected === "DICTIONARY"){
                detailPanel.textContent = dictionaryContent;
            } else if(selected === "EXIT"){
                container.classList.remove("menu-open");
                detailPanel.textContent = "";
                pwInput.value = "";
                setTimeout(() => pwInput.focus(), 500);
            } else {
                detailPanel.textContent = "Coming Soon";
            }
        }
    });
</script>
</body>
</html>
