<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Dictionary</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: black;
    font-family: monospace;
    color: white;
  }

  /* Container (bean → square) */
  #container {
    width: 280px;        /* bean width */
    height: 50px;        /* bean height */
    background: black;
    border: 2px solid white;
    border-radius: 25px; /* capsule look */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: all 0.8s ease-in-out;
  }

  /* Square state */
  #container.square {
    width: 600px;
    height: 300px;
    border-radius: 8px; /* sharp corners */
    padding: 20px;
    justify-content: flex-start;
  }

  /* Input wrapper to fix cursor alignment */
  #input-wrapper {
    width: 100%;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.8s ease-in-out;
  }

  #container.square #input-wrapper {
    justify-content: flex-start; /* move input to top in square */
  }

  /* Password input */
  #password-input {
    width: 180px;
    height: 30px;
    background: transparent;
    border: none;
    color: white;
    font-family: monospace;
    font-size: 18px;
    outline: none;
    caret-color: white;
    line-height: 1;
    margin: 0;
    padding: 0;
    text-align: left;
  }

  /* Dictionary text */
  #dictionary {
    color: white;
    font-size: 16px;
    white-space: pre-wrap;
    opacity: 0;
    margin-top: 10px;
    overflow: hidden;
    flex: 1;
  }
</style>
</head>
<body>

<div id="container">
  <div id="input-wrapper">
    <input type="password" id="password-input" autofocus>
  </div>
  <div id="dictionary"></div>
</div>

<script>
const correctPassword = "@2#1#3$1#1%1#1^3%2(2*1@2^2#3(1&1^3#3*1(2!2#2$3!2^3#3#1#2";

const dictionaryData = `
📖 Private Dictionary
------------------------
KuroSaru - (noun) A Japanese-inspired name meaning “Black Monkey”
Kokujin - (noun) Japanese term meaning “black person”
Janna - (slang'd-name) Someone fat
Kevin - (slang'd-name) Kevin is a slang term meaning "something bad"
Owen - (slang'd-name) meaning "something good"
Pica - (vulgar) Slovak insult, roughly equivalent to “bitch”
`;

const container = document.getElementById("container");
const input = document.getElementById("password-input");
const dict = document.getElementById("dictionary");

input.addEventListener("keydown", e => {
  if(e.key === "Enter") {
    if(input.value === correctPassword) {
      container.classList.add("square");

      // fade out input while keeping cursor hidden
      input.style.opacity = 0;

      // type out dictionary after morph
      setTimeout(() => {
        let i = 0;
        dict.style.opacity = 1;
        (function typeDict(){
          if(i < dictionaryData.length){
            dict.textContent += dictionaryData[i++];
            setTimeout(typeDict, 15);
          }
        })();
      }, 900);
    } else {
      input.value = "";
      alert("Access denied. Try again.");
    }
  }
});
</script>

</body>
</html>
