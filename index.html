<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secret English Council Advance</title>
  <style>
    body {
      background: black;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden; /* remove useless scroll */
      font-family: monospace;
      color: white;
    }

    .bean {
      display: flex;
      justify-content: center;
      align-items: center;
      background: black;
      border: 2px solid white;
      border-radius: 50px; /* start round like a bean */
      width: 250px;
      height: 50px;
      transition: all 1s ease-in-out;
      position: relative;
      overflow: hidden;
    }

    .bean.square {
      width: 600px;
      height: 400px;
      border-radius: 0; /* sharp corners */
    }

    .input {
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 18px;
      text-align: center;
      caret-color: white;
      width: 100%;
    }

    .hidden {
      display: none;
    }

    .dictionary {
      opacity: 0;
      padding: 20px;
      font-size: 16px;
      line-height: 1.5em;
      text-align: left;
      overflow-y: auto;
      height: 100%;
      box-sizing: border-box;
      transition: opacity 1s ease-in-out;
    }

    .square .dictionary {
      opacity: 1; /* fade in smoothly */
    }
  </style>
</head>
<body>
  <div class="bean" id="beanBox">
    <input type="password" id="passwordInput" class="input" autofocus>
    <div id="dictionary" class="dictionary hidden">
      Welcome to the Secret English Council.<br>
      This is your hidden dictionary.<br>
      Type wisely and uncover secrets.
    </div>
  </div>

  <script>
    const input = document.getElementById("passwordInput");
    const beanBox = document.getElementById("beanBox");
    const dictionary = document.getElementById("dictionary");

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        if (input.value === "secret") { // <-- your password
          input.classList.add("hidden");
          dictionary.classList.remove("hidden");
          beanBox.classList.add("square");
        }
      }
    });
  </script>
</body>
</html>
