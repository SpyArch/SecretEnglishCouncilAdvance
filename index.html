<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Dictionary</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: black;
      font-family: monospace;
      color: white;
    }

    #container {
      width: 300px;
      padding: 12px 16px;
      background: black;
      border: 2px solid white;
      border-radius: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.5s ease;
      overflow: hidden;
      flex-direction: column;
    }

    #container.square {
      width: 600px;
      height: 300px;
      border-radius: 8px;
      padding: 20px;
      justify-content: flex-start;
    }

    #password-input {
      width: 100%;
      background: black;
      border: none;
      color: white;
      font-family: monospace;
      font-size: 18px;
      outline: none;
      caret-color: white;
    }

    .caret {
      display: inline-block;
      width: 10px;
      background-color: white;
      animation: blink 1s steps(1) infinite;
      margin-left: 4px;
    }

    @keyframes blink {
      50% { background-color: transparent; }
    }

    #dictionary {
      color: white;
      font-size: 16px;
      white-space: pre-wrap;
      opacity: 0;
      margin-top: 10px;
      overflow-y: auto;
      flex: 1;
    }
  </style>
</head>
<body>

<div id="container">
  <input type="password" id="password-input" autofocus>
  <span class="caret"></span>
  <div id="dictionary"></div>
</div>

<script>
  const correctPassword = "@2#1#3$1#1%1#1^3%2(2*1@2^2#3(1&1^3#3*1(2!2#2$3!2^3#3#1#2";
  const dictionaryData = `
  📖 Private Dictionary
  ------------------------
  KuroSaru - (noun) A Japanese-inspired name meaning “Black Monkey”
  Kokujin - (noun) Japanese term meaning “black person”
  Janna - (slang'd-name) Someone fat
  Kevin - (slang'd-name) Kevin is a slang term meaning "something bad"
  Owen - (slang'd-name) meaning "something good"
  Pica - (vulgar) Slovak insult, roughly equivalent to “bitch”
  `;

  const container = document.getElementById("container");
  const input = document.getElementById("password-input");
  const dict = document.getElementById("dictionary");
  const caret = document.querySelector(".caret");

  input.addEventListener("keydown", e => {
    if(e.key === "Enter"){
      if(input.value === correctPassword){
        container.classList.add("square");
        input.style.display = "none";
        caret.style.display = "none";

        let i = 0;
        dict.style.opacity = 1;
        (function typeDict(){
          if(i < dictionaryData.length){
            dict.textContent += dictionaryData[i++];
            setTimeout(typeDict, 15);
          }
        })();
      } else {
        input.value = "";
        alert("Access denied. Try again.");
      }
    }
  });
</script>

</body>
</html>
