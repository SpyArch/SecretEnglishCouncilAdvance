<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SECRET ENGLISH COUNCIL ADVANCED</title>
<style>
  body {
    background-color: black;
    font-family: monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    color: white;
  }

  /* Terminal-like password input */
  #password-container {
    font-size: 18px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  #password-input {
    background: black;
    border: none;
    color: white;
    font-family: monospace;
    font-size: 18px;
    outline: none;
    width: 200px;
  }
  .caret {
    display: inline-block;
    width: 10px;
    background-color: white;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink {
    50% { background-color: transparent; }
  }

  /* Dictionary box */
  #dictionary-container {
    display: none;
    background-color: white;
    color: black;
    padding: 20px;
    width: 600px;
    max-width: 90%;
    border-radius: 8px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    white-space: pre-wrap;
    font-size: 16px;
  }

  /* Smooth transition */
  .fade-in {
    animation: fadeIn 0.5s ease forwards;
  }
  @keyframes fadeIn {
    0% { opacity: 0; transform: translateY(-20px); }
    100% { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div id="password-container">
  <span>Enter password: </span>
  <input type="password" id="password-input" autofocus />
  <span class="caret"></span>
</div>

<div id="dictionary-container"></div>

<script>
const correctPassword = "@2#1#3$1#1%1#1^3%2(2*1@2^2#3(1&1^3#3*1(2!2#2$3!2^3#3#1#2";

const dictionaryData = `
📖 Private Dictionary
------------------------
KuroSaru - (noun) A Japanese-inspired name meaning “Black Monkey”; from kuro (黒, “black”) + saru (猿, “monkey”)
Kokujin - (noun) Japanese term meaning “black person”; from koku (黒, “black”) + jin (人, “person”) EDITORS NOTE: I expected this means the n-word but I was wrong
Janna - (slang'd-name) Someone fat (yeah that's just it)
Kevin - (slang'd-name) Kevin or TS; slang term meaning "something bad," popularized on TikTok in mid-April 2025
Owen - (slang'd-name) Alongside other names-turned-slang-terms, including "Owen," meaning "something good"
Pica - (vulgar) A crude insult in Slovak, roughly equivalent to “bitch”; refers to a woman in an offensive way.
`;

const input = document.getElementById("password-input");
const passwordContainer = document.getElementById("password-container");
const dictContainer = document.getElementById("dictionary-container");

input.addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    if (input.value === correctPassword) {
      passwordContainer.style.display = "none";
      dictContainer.textContent = dictionaryData;
      dictContainer.style.display = "block";
      dictContainer.classList.add("fade-in");
    } else {
      input.value = "";
      alert("Access denied. Try again.");
    }
  }
});
</script>

</body>
</html>
