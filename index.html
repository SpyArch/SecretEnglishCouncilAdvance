<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Protected Interface</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; background:black; color:white; font-family:monospace; }
    body { display:flex; justify-content:center; align-items:center; overflow:hidden; }

    /* Container (capsule → rectangle) */
    #container {
        width:300px; height:40px;
        border:2px solid white; border-radius:20px;
        display:flex; align-items:center; justify-content:center;
        transition:width 0.6s ease, height 0.6s ease, border-radius 0.6s ease;
        overflow:hidden;
    }
    #container.menu-open {
        width:90vw; max-width:800px;
        height:70vh; max-height:400px;
        border-radius:10px;
    }

    /* Password */
    #passwordSection { flex:1; padding:5px; }
    #passwordInput {
        width:100%; background:transparent; border:none; outline:none;
        color:white; font-size:1rem; text-align:center;
    }

    /* Menu section */
    #menuSection { display:none; width:100%; height:100%; padding:10px; }
    #container.menu-open #menuSection { display:flex; }
    #container.menu-open #passwordSection { display:none; }

    #menuList { width:150px; display:flex; flex-direction:column; }
    .menuItem { padding:5px 10px; cursor:pointer; }
    .menuItem.selected::before { content:"> "; }

    /* Detail panel */
    #detailPanel { flex:1; padding:5px 10px; border-left:1px solid white; margin-left:10px; }
    .detailOption { display:block; padding:3px 0; cursor:pointer; }
    .detailOption.selected::before { content:"> "; }
</style>
</head>
<body>
<div id="container">
    <div id="passwordSection">
        <input type="password" id="passwordInput" placeholder="Password" autofocus>
    </div>
    <div id="menuSection">
        <div id="menuList">
            <div class="menuItem selected">BOUNTY</div>
            <div class="menuItem">MEDIA</div>
            <div class="menuItem">DICTIONARY</div>
            <div class="menuItem">EXIT</div>
        </div>
        <div id="detailPanel"></div>
    </div>
</div>

<script>
const password = "@2#1#3$1#1%1#1^3%2(2*1@2^2#3(1&1^3#3*1(2!2#2$3!2^3#3#1#2";
const dictionaryContent = `📖 Private Dictionary
------------------------
KuroSaru - (noun) A Japanese-inspired name meaning “Black Monkey”
Kokujin - (noun) Japanese term meaning “black person”
Airball - Filipino Starter Pack (also known as Feyleypenos)
Gerald - Someone Black
Janna - (slang'd-name) Someone fat
Kevin - (slang'd-name) Kevin is a slang term meaning "something bad"
Owen - (slang'd-name) meaning "something good"
Pica - (vulgar) Slovak insult, roughly equivalent to “bitch”`;

const detailTemplates = {
    "BOUNTY": ["DISCORD"],
    "MEDIA": ["INSTAGRAM"],
    "DICTIONARY": ["ROBLOX", dictionaryContent],
    "EXIT": []
};

const container = document.getElementById("container");
const pwInput = document.getElementById("passwordInput");
const menuItems = Array.from(document.querySelectorAll(".menuItem"));
const detailPanel = document.getElementById("detailPanel");

let selectedMenu = 0;
let selectedDetail = 0;
let konami = [];
const konamiCode = ["ArrowUp","ArrowUp","ArrowDown","ArrowDown","ArrowLeft","ArrowRight","ArrowLeft","ArrowRight","b","a","Enter"];

// Unlock menu
pwInput.addEventListener("keydown", e=>{
    if(e.key==="Enter"){
        if(pwInput.value===password){
            container.classList.add("menu-open");
            pwInput.value="";
            showDetails(menuItems[selectedMenu].textContent.trim());
        } else {
            alert("Access Denied");
            pwInput.value="";
        }
    }
});

// Show detail panel contents
function showDetails(menu){
    detailPanel.innerHTML="";
    if(menu==="EXIT") return;
    const data=detailTemplates[menu];
    if(!data) return detailPanel.textContent="Coming soon";
    if(menu==="DICTIONARY"){
        detailPanel.textContent=data[1]; // dictionary text
    } else {
        data.forEach((opt,i)=>{
            const div=document.createElement("div");
            div.textContent=opt;
            div.className="detailOption"+(i===0?" selected":"");
            div.addEventListener("click",()=> alert(opt+" clicked (Coming soon)"));
            detailPanel.appendChild(div);
        });
    }
    selectedDetail=0;
}

// Navigation (keyboard)
document.addEventListener("keydown", e=>{
    if(!container.classList.contains("menu-open")) return;

    konami.push(e.key);
    if(konami.length>konamiCode.length) konami.shift();
    if(JSON.stringify(konami)===JSON.stringify(konamiCode)){
        window.open("https://www.youtube.com/watch?v=dQw4w9WgXcQ","_blank");
    }

    if(e.key==="w"||e.key==="ArrowUp"){
        menuItems[selectedMenu].classList.remove("selected");
        selectedMenu=(selectedMenu-1+menuItems.length)%menuItems.length;
        menuItems[selectedMenu].classList.add("selected");
        showDetails(menuItems[selectedMenu].textContent.trim());
    }
    if(e.key==="s"||e.key==="ArrowDown"){
        menuItems[selectedMenu].classList.remove("selected");
        selectedMenu=(selectedMenu+1)%menuItems.length;
        menuItems[selectedMenu].classList.add("selected");
        showDetails(menuItems[selectedMenu].textContent.trim());
    }
    if(e.key==="a"||e.key==="ArrowLeft"||e.key==="d"||e.key==="ArrowRight"){
        const options=Array.from(document.querySelectorAll(".detailOption"));
        if(options.length>0){
            options[selectedDetail].classList.remove("selected");
            selectedDetail=(selectedDetail+(e.key==="a"||e.key==="ArrowLeft"?-1:1)+options.length)%options.length;
            options[selectedDetail].classList.add("selected");
        }
    }
    if(e.key==="Enter"){
        const menu=menuItems[selectedMenu].textContent.trim();
        if(menu==="EXIT"){
            container.classList.remove("menu-open");
            detailPanel.textContent="";
            pwInput.focus();
            return;
        }
        const options=Array.from(document.querySelectorAll(".detailOption"));
        if(options.length>0){
            alert(options[selectedDetail].textContent+" clicked (Coming soon)");
        }
    }
});

// Mobile support (tap to select)
menuItems.forEach((item,i)=>{
    item.addEventListener("click",()=>{
        menuItems[selectedMenu].classList.remove("selected");
        selectedMenu=i;
        item.classList.add("selected");
        showDetails(item.textContent.trim());
    });
});
</script>
</body>
</html>
